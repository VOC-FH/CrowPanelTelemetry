; Uses the same sketch and prepared, pinned libraries as Arduino IDE/CLI.
; Set DEPS to the absolute dependency collection path before starting PlatformIO.
[platformio]
default_envs = crowpanel-prev3
src_dir = .
include_dir = .
workspace_dir = build/codex/platformio
core_dir = build/codex/platformio-core

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_upload.maximum_ram_size = 327680
board_build.f_flash = 80000000L
board_build.flash_mode = qio
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0
build_src_filter =
    +<*.ino>
    +<*.cpp>
    -<tests/>
    -<tools/>
    -<docs/>
    -<learning/>
    -<build/>
    -<checkouts/>
lib_deps =
    symlink://${sysenv.DEPS}/Arduino_GFX
    symlink://${sysenv.DEPS}/RadioLib
    symlink://${sysenv.DEPS}/INA226
    symlink://${sysenv.DEPS}/TinyGPSPlus
    symlink://${sysenv.DEPS}/JPEGDEC
    symlink://${sysenv.DEPS}/audio-driver

[env:crowpanel-prev3]
board_build.chip_variant = esp32p4_es
board_build.f_cpu = 360000000L

[env:crowpanel-postv3]
board_build.chip_variant = esp32p4
board_build.f_cpu = 400000000L
